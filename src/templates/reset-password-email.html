<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password email</title>
  </head>

  <body style="font-family: Arial, sans-serif; background-color: #f9f9f9; padding: 20px;">
    <div style="max-width: 500px; margin: 0 auto; background-color: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);">
      <h1 style="color: #007bff; text-align: center;">Hello, {{name}}!</h1>
      <p style="font-size: 16px; color: #333;">
        You requested to reset your password.
      </p>
      <p style="font-size: 16px; color: #333;">
        Click the link below to set a new one:
      </p>
      <p style="text-align: center;">
        <a href="{{link}}" style="display: inline-block; background-color: #007bff; color: #fff; padding: 10px 20px; border-radius: 5px; text-decoration: none; font-weight: bold;">
          Reset Password
        </a>
      </p>
      <p style="font-size: 14px; color: #777;">
        If you didn’t request this, you can safely ignore this email.
      </p>
    </div>
  </body>
</html>
